name: Generate and Commit ZPG

# Allow manual run and schedule
on:
  schedule:
    # GitHub Actions cron is always in UTC.
    #
    # UTC hours:        00   02   06   08   12   19   21
    #
    # EST (UTC-5, Nov–Mar):
    #   07:00 PM  09:00 PM  01:00 AM  03:00 AM  07:00 AM  02:00 PM  04:00 PM
    #   (prev day) (prev day)
    #
    # EDT (UTC-4, Mar–Nov):
    #   08:00 PM  10:00 PM  02:00 AM  04:00 AM  08:00 AM  03:00 PM  05:00 PM
    #   (prev day) (prev day)
    #
    # IST (UTC+5:30), for reference:
    #   05:30 AM  07:30 AM  11:30 AM  01:30 PM  05:30 PM  12:30 AM  02:30 AM
    #                                            (next day) (next day)
    - cron: "0 12,19,21,0,2,6,8 * * *"
  workflow_dispatch:

# Give the workflow permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for safe push
          persist-credentials: true   # use the GITHUB_TOKEN provided to the runner

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG generation
        run: |
          python crawl.py
        env:
          # optional environment variables can be set here
          PYTHONUNBUFFERED: 1

      - name: Show output dir
        run: |
          ls -la output || true

      - name: Commit and push output files
        run: |
          # configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # add generated files
          git add output/Ind-Zpg.xml output/Ind-Zpg.xml.gz || true

          # commit only if there are changes
          git diff --cached --quiet || git commit -m "ci: update Ind-Zpg (generated) [skip ci]"

          # push back to same branch
          git push origin HEAD:refs/heads/${{ github.ref_name }}
