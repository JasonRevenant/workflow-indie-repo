name: Generate and Commit ZPG

# allow manual run and schedule
on:
  schedule:
    - cron: "0 12,22,3 * * *"  # Runs at 7 AM, 5 PM, and 10 PM EST (in UTC)
  workflow_dispatch:

# Give the workflow permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for safe push
          persist-credentials: true   # use the GITHUB_TOKEN provided to the runner

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG generation
        run: |
          python crawl.py
        env:
          # optional environment variables can be set here
          PYTHONUNBUFFERED: 1

      - name: Show output dir
        run: |
          ls -la output || true

      - name: Commit and push output files
        run: |
          # configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # add generated files
          git add output/Ind-Zpg.xml output/Ind-Zpg.xml.gz || true

          # commit only if there are changes
          git diff --cached --quiet || git commit -m "ci: update Ind-Zpg (generated) [skip ci]"

          # push back to same branch
          git push origin HEAD:refs/heads/${{ github.ref_name }}
